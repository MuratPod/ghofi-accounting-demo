--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--r-sm:4px;--r-md:6px;--r-lg:10px;--r-xl:16px;--r-pill:999px;
--sh-1:0 1px 2px rgba(20,33,61,.08);--sh-2:0 4px 12px rgba(20,33,61,.12);--sh-3:0 12px 32px rgba(20,33,61,.18);
--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--fs-display:28px;--fs-h1:22px;--fs-h2:16px;--fs-body:14px;--fs-body-s:13px;--fs-caption:12px;--row:40px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font:var(--fs-body)/1.45 var(--font);color:var(--ink-900);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--primary-600)}
.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
:focus-visible{outline:2px solid var(--primary-600);outline-offset:2px;box-shadow:0 0 0 2px #fff}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;z-index:99;background:#fff;padding:8px}
/* banners */
.synbar{background:var(--mock-700);color:#fff;text-align:center;font-size:12px;font-weight:600;padding:5px 10px;letter-spacing:.2px}
.advbar{background:var(--mock-50);color:#4d2577;text-align:center;font-size:13px;font-weight:600;padding:6px;border-bottom:1px solid #dcc8f2}
.offbar{background:var(--warn-50);color:var(--warn-800);text-align:center;font-size:13px;padding:6px;font-weight:600}
/* header */
.top{display:flex;align-items:center;gap:var(--s3);background:var(--navy-900);color:#fff;padding:8px var(--s4);position:sticky;top:0;z-index:20;min-height:56px}
.brand{line-height:1.25}.brand b{font-size:15px;display:block}.brand small{opacity:.75;font-size:12px}
.top .sp{flex:1}
.top .demo{font-size:12px;opacity:.9;white-space:nowrap}.top .demo b{margin-left:6px}
.searchbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r-md);padding:7px 10px;min-width:240px;cursor:pointer;font:inherit;font-size:13px}
.searchbtn kbd{margin-left:auto;font:12px var(--font);opacity:.7}
.iconbtn{position:relative;background:none;border:0;color:inherit;padding:8px;border-radius:var(--r-md);cursor:pointer;display:inline-flex}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn .dot{position:absolute;top:3px;right:2px;background:var(--bad-700);color:#fff;border-radius:var(--r-pill);font-size:12px;font-weight:700;padding:0 5px;line-height:16px}
.top select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:var(--r-md);padding:5px 6px;font:inherit;font-size:12px}
.top select option{color:var(--ink-900)}
.burger{display:none}
/* layout */
.layout{display:flex;min-height:calc(100vh - 82px)}
.side{width:240px;background:var(--surface);border-right:1px solid var(--line-subtle);padding:var(--s2);flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.side .grp{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-600);font-weight:700;margin:14px 10px 4px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:var(--ink-900);text-decoration:none;font-size:14px;margin-bottom:1px;border-left:3px solid transparent}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--primary-50);color:var(--primary-600);font-weight:600;border-left-color:var(--primary-600)}
.side .badge{margin-left:auto}
.badge{background:var(--bad-700);color:#fff;border-radius:var(--r-pill);font-size:12px;font-weight:700;padding:0 7px;line-height:18px}
.badge.n{background:var(--surface-2);color:var(--neutral-700)}
.side .foot{margin-top:16px;padding:10px;font-size:12px;color:var(--ink-600);border-top:1px solid var(--line-subtle)}
.main{flex:1;min-width:0;padding:var(--s5);max-width:1360px}
/* typography */
h1{font-size:var(--fs-h1);line-height:1.3;margin:0}
h2{font-size:var(--fs-h2);line-height:1.3;margin:0 0 var(--s3)}
h3{font-size:14px;margin:var(--s4) 0 var(--s2)}
.muted{color:var(--ink-600)}.cap{font-size:var(--fs-caption);color:var(--ink-600)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad-700)}.pos{color:var(--ok-700)}
.display{font-size:var(--fs-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.phead{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.phead .t{flex:1;min-width:220px}.phead .t p{margin:4px 0 0;color:var(--ink-600)}
.phead .acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--ink-600);margin-bottom:4px}.crumbs a{color:var(--ink-600)}
.sid{font-size:12px;font-weight:700;color:var(--mock-700);background:var(--mock-50);border-radius:var(--r-sm);padding:1px 6px;margin-left:8px;vertical-align:3px}
/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line-subtle);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1);margin-bottom:var(--s4)}
.card.flat{box-shadow:none}
.card h2 .r{float:right;font-weight:400;font-size:13px}
.grid{display:grid;gap:var(--s4)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.kpi{margin:0}.kpi .l{font-size:12px;color:var(--ink-600)}.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}.kpi .s{font-size:12px;color:var(--ink-600);margin-top:2px}
a.kpi{text-decoration:none;color:inherit;display:block}a.kpi:hover{border-color:var(--primary-600)}
.next{background:linear-gradient(135deg,var(--navy-900),#223a6b);color:#fff;border:0}
.next .cap{color:#c9d5ef}.next h2{font-size:20px;margin:6px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-control);background:var(--surface);border-radius:var(--r-md);padding:0 14px;height:36px;cursor:pointer;font:600 13px var(--font);color:var(--ink-900);text-decoration:none;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--primary-600);color:#fff;border-color:var(--primary-600)}.btn.p:hover{background:var(--primary-700)}
.btn.g{border-color:transparent;background:transparent;color:var(--primary-600)}.btn.g:hover{background:var(--primary-50)}
.btn.d{background:var(--bad-700);color:#fff;border-color:var(--bad-700)}
.btn.w{background:#fff;color:var(--navy-900);border-color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.lg{height:44px;padding:0 18px;font-size:14px}
.btn[aria-disabled=true],.btn:disabled{opacity:.5;cursor:not-allowed}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;border-radius:var(--r-sm);padding:0 7px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-50);color:var(--ok-700)}.c-warn{background:var(--warn-50);color:var(--warn-800)}.c-bad{background:var(--bad-50);color:var(--bad-700)}.c-neu{background:var(--surface-2);color:var(--neutral-700)}.c-pri{background:var(--primary-50);color:var(--primary-600)}.c-mock{background:var(--mock-50);color:var(--mock-700)}
.chip.solid-mock{background:var(--mock-700);color:#fff}
/* confidence */
.conf{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
.conf .bar{width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.conf .bar i{display:block;height:100%}
.conf b{font-variant-numeric:tabular-nums}
/* draftbar */
.draftbar{background:repeating-linear-gradient(45deg,var(--warn-50),var(--warn-50) 10px,#ffe9c2 10px,#ffe9c2 20px);border:1px solid #f0c680;color:var(--warn-800);font-weight:700;text-align:center;padding:8px;border-radius:var(--r-md);margin-bottom:var(--s4);font-size:13px;letter-spacing:.3px}
.draftbar small{font-weight:500;display:block;letter-spacing:0}
/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:10px 12px;margin-bottom:var(--s3);font-size:13px;border:1px solid transparent}
.a-info{background:var(--primary-50);color:#1b3c86;border-color:#c9d8f6}.a-warn{background:var(--warn-50);color:var(--warn-800);border-color:#f0d3a0}.a-bad{background:var(--bad-50);color:var(--bad-700);border-color:#f3c0bb}.a-ok{background:var(--ok-50);color:var(--ok-700);border-color:#b9e2c9}.a-mock{background:var(--mock-50);color:#4d2577;border-color:#dcc8f2}
.alert .sp{flex:1}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line-subtle);border-radius:var(--r-lg);background:var(--surface);max-height:620px}
table{width:100%;border-collapse:collapse;font-size:var(--fs-body-s)}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;color:var(--ink-600);font-weight:600;font-size:12px;border-bottom:1px solid var(--line-subtle);padding:8px 12px;white-space:nowrap}
td{padding:0 12px;height:var(--row);border-bottom:1px solid #eef1f6;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f8faff}
tr.sel td{background:var(--primary-50)!important}
tr.done td{opacity:.55}
th.num,td.num{text-align:right}
td.wrap{white-space:normal}
.grouprow td{background:var(--surface-2);font-weight:600;height:36px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary-600);vertical-align:-3px}
.tfoot{display:flex;justify-content:space-between;padding:8px 4px;font-size:12px;color:var(--ink-600)}
/* filters / tabs / forms */
.filters{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3);align-items:center}
.in,select.in,textarea.in{height:36px;padding:0 10px;border:1px solid var(--line-control);border-radius:var(--r-md);font:inherit;font-size:13px;background:#fff;color:var(--ink-900)}
textarea.in{height:auto;padding:8px 10px;width:100%;min-height:72px}
.in.search{min-width:220px}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-50);color:var(--primary-600);border-radius:var(--r-pill);padding:3px 10px;font-size:12px;font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-subtle);margin-bottom:var(--s3);overflow:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:600 13px var(--font);color:var(--ink-600);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--primary-600);border-bottom-color:var(--primary-600)}
.tabs .badge{background:var(--surface-2);color:var(--neutral-700)}.tabs button.on .badge{background:var(--primary-50);color:var(--primary-600)}
.seg{display:inline-flex;border:1px solid var(--line-control);border-radius:var(--r-md);overflow:hidden}.seg button{border:0;background:#fff;padding:0 12px;height:34px;font:600 12px var(--font);cursor:pointer;color:var(--ink-900)}.seg button.on{background:var(--primary-600);color:#fff}
.form{display:grid;gap:var(--s3);max-width:640px}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.fld .in{width:100%}.fld .hint{font-size:12px;color:var(--ink-600);margin-top:3px}.fld .err{font-size:12px;color:var(--bad-700);margin-top:3px}
.fld .sug{font-size:12px;font-weight:700;color:var(--mock-700);margin-left:6px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch i{width:36px;height:20px;border-radius:10px;background:var(--line-control);position:relative;transition:.12s}.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.12s}
.switch.on i{background:var(--primary-600)}.switch.on i:after{left:18px}
.drop{border:2px dashed #a9b6d3;border-radius:var(--r-lg);padding:var(--s6);text-align:center;background:#fafbff;color:var(--ink-600)}
.drop b{color:var(--ink-900);display:block;font-size:15px;margin-bottom:4px}
/* stepper */
.stepper{display:flex;gap:0;margin:4px 0 var(--s4);overflow:auto}
.stepper .st{flex:1;min-width:120px;padding:10px 12px;background:var(--surface);border:1px solid var(--line-subtle);border-left:0;font-size:12px;text-decoration:none;color:inherit}
.stepper .st:first-child{border-left:1px solid var(--line-subtle);border-radius:var(--r-lg) 0 0 var(--r-lg)}.stepper .st:last-child{border-radius:0 var(--r-lg) var(--r-lg) 0}
.stepper .st b{display:block;font-size:13px;color:var(--ink-900);margin-top:2px}
.stepper .st.done{background:var(--ok-50)}.stepper .st.cur{background:var(--primary-50);box-shadow:inset 0 -3px 0 var(--primary-600)}
.wiz{display:grid;grid-template-columns:220px 1fr;gap:var(--s5)}
.wiz ol{list-style:none;margin:0;padding:0}.wiz li{display:flex;gap:10px;align-items:center;padding:8px 6px;font-size:13px;color:var(--ink-600);cursor:pointer;border-radius:var(--r-md)}
.wiz li .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-control);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.wiz li.on{color:var(--primary-600);font-weight:600;background:var(--primary-50)}.wiz li.on .n{background:var(--primary-600);color:#fff;border-color:var(--primary-600)}
.wiz li.done .n{background:var(--ok-700);color:#fff;border-color:var(--ok-700)}
/* lists */
.list .it{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #eef1f6;color:inherit;text-decoration:none}
.list .it:last-child{border-bottom:0}.list a.it:hover{background:#f8faff}
.list .cnt{min-width:38px;text-align:center;border-radius:var(--r-md);padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.list .it .grow{flex:1;min-width:0}
/* exception card */
.exc{border:1px solid var(--line-subtle);border-left:4px solid var(--warn-800);border-radius:var(--r-lg);padding:12px 14px;background:var(--surface);margin-bottom:var(--s2)}
.exc.hi{border-left-color:var(--bad-700)}.exc.lo{border-left-color:var(--line-control)}
.exc .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exc .h .sp{flex:1}
.exc .b{margin:6px 0;font-size:13px}.exc .a{display:flex;gap:6px;flex-wrap:wrap}
.code{font:700 12px ui-monospace,Menlo,monospace;background:var(--surface-2);border-radius:var(--r-sm);padding:2px 5px}
/* drawer / dialog / toast */
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.35);z-index:39}
.drawer{position:fixed;top:0;right:0;width:min(520px,100%);height:100%;background:#fff;box-shadow:var(--sh-3);z-index:40;overflow:auto;padding:var(--s5);animation:sl .2s}
@keyframes sl{from{transform:translateX(40px);opacity:.4}}
.drawer .x{position:absolute;top:12px;right:12px}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-3);z-index:50;padding:var(--s5)}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:var(--s4)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r-md);z-index:60;display:flex;gap:14px;align-items:center;box-shadow:var(--sh-2);font-size:13px}
.toast button{background:none;border:0;color:#9fbcff;font:700 13px var(--font);cursor:pointer}
.cite{border-left:3px solid var(--primary-600);padding:6px 10px;margin:8px 0;background:#f7f9fe;font-size:13px}
.cmt{border-left:3px solid var(--mock-700);padding:6px 10px;margin:8px 0;background:#faf6fe;font-size:13px}
.popover{position:fixed;top:58px;right:16px;width:min(380px,94vw);background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-2);z-index:45;border:1px solid var(--line-subtle);max-height:70vh;overflow:auto}
.popover .it{padding:10px 14px;border-bottom:1px solid #eef1f6;font-size:13px;display:block;color:inherit;text-decoration:none}.popover .it:hover{background:#f8faff}
.popover .it.unread{background:#f7f9fe;border-left:3px solid var(--primary-600)}
.kbar{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(640px,94vw);background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-3);z-index:50;overflow:hidden}
.kbar input{width:100%;border:0;border-bottom:1px solid var(--line-subtle);padding:16px;font:16px var(--font);outline:none}
.kbar .res{max-height:50vh;overflow:auto}.kbar .res .g{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--ink-600);padding:10px 16px 4px}
.kbar .res a{display:flex;gap:10px;padding:8px 16px;text-decoration:none;color:inherit;font-size:13px}.kbar .res a:hover,.kbar .res a.on{background:var(--primary-50)}
/* doc viewer */
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.paper{background:#fff;border:1px solid #ccd3e2;padding:24px;font-family:Georgia,serif;font-size:13px;position:relative;min-height:520px;overflow:hidden;box-shadow:var(--sh-1)}
.paper:after{content:"SINTÉTICO";position:absolute;top:42%;left:10%;font-size:72px;color:rgba(122,63,181,.12);transform:rotate(-20deg);font-weight:700;font-family:var(--font);pointer-events:none}
.paper .hl{background:rgba(36,87,197,.14);outline:2px solid var(--primary-600);border-radius:2px}
.field{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,160px);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f6}
.field .k{font-size:12px;color:var(--ink-600);font-weight:600}.field .in{height:32px;width:100%}
.field.low .in{border-color:var(--bad-700);background:var(--bad-50)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line-subtle);border-radius:var(--r-lg);overflow:hidden;background:var(--line-subtle);gap:1px}
.cal .dh{background:var(--surface-2);font-size:12px;font-weight:700;text-align:center;padding:6px;color:var(--ink-600)}
.cal .d{background:#fff;min-height:92px;padding:6px;font-size:12px}.cal .d.o{background:#f4f6fa;color:var(--ink-600)}.cal .d.today{box-shadow:inset 0 0 0 2px var(--primary-600)}
.cal .ev{display:block;margin-top:3px;font-size:12px;font-weight:600;border-radius:var(--r-sm);padding:2px 4px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chart */
.bars{display:flex;gap:18px;align-items:flex-end;height:170px;padding-top:10px}
.bars .col{flex:1;text-align:center;font-size:12px;color:var(--ink-600)}
.bars .b{display:flex;gap:4px;align-items:flex-end;height:130px;justify-content:center}
.bars .b i{display:block;width:22px;border-radius:3px 3px 0 0}
.bars .in-c{background:var(--ok-700)}.bars .out-c{background:repeating-linear-gradient(45deg,var(--bad-700),var(--bad-700) 3px,#d0544c 3px,#d0544c 6px)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-600)}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
/* months ribbon */
.months{display:flex;gap:6px;overflow:auto;margin-bottom:var(--s3)}
.months a{border:1px solid var(--line-subtle);background:#fff;border-radius:var(--r-md);padding:6px 12px;font-size:12px;text-decoration:none;color:inherit;white-space:nowrap}
.months a.on{border-color:var(--primary-600);background:var(--primary-50);color:var(--primary-600);font-weight:600}
/* bulk bar */

.sys{max-width:520px;margin:8vh auto;text-align:center}

.logo .m{width:36px;height:36px;border-radius:9px;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-size:15px}
/* tokens page */
.sw{border:1px solid var(--line-subtle);border-radius:var(--r-lg);overflow:hidden;background:#fff}.sw .c{height:64px}.sw .m{padding:8px 10px;font-size:12px}.sw code{font-size:12px;color:var(--ink-600)}

.map a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:var(--r-md);text-decoration:none;color:inherit;font-size:13px}.map a:hover{background:var(--primary-50)}
.legal{font-size:12px;color:var(--ink-600);border-top:1px solid var(--line-subtle);padding-top:10px;margin-top:var(--s4)}
